<div class="bg-base-900 rounded-xl border-base-800 border-2 flex items-center gap-5 p-5">

  <!-- Color swatch -->
  <div
    class="w-16 h-16 rounded-lg shrink-0 flex items-center justify-center"
    [style.background-color]="group.color"
  >
    <img src="assets/images/icons/navigation/groups.svg" class="w-8 h-8 opacity-80"/>
  </div>

  <!-- Info -->
  <div class="flex flex-col flex-1 gap-1 min-w-0">
    <h3 class="text-xl font-mono font-bold text-light-300 truncate">{{ group.name }}</h3>
    <p class="font-mono text-sm text-light-500 truncate">{{ group.description }}</p>
    <span class="font-mono text-xs text-light-600">{{ group.memberCount }} members</span>
  </div>

  <!-- Action -->
  @if (isCurrentGroup) {
    <button class="hover:scale-110 transition shrink-0 hover:opacity-60">
      <img src="assets/images/icons/navigation/settings.svg" class="w-6 h-6"/>
    </button>
  } @else {
    <button
      class="bg-base-200 border-glow-blue-500 border-2 text-white px-4 py-2 rounded font-mono font-bold hover:opacity-60 transition shrink-0"
    >
      Join
    </button>
  }

</div>
