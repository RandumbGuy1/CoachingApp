<div class="glass-card rounded-xl flex items-center gap-4 p-4">

  <!-- Color swatch -->
  <div
    class="w-12 h-12 rounded-lg shrink-0 flex items-center justify-center"
    [style.background-color]="group.color"
  >
    <img src="assets/images/icons/navigation/groups.svg" class="w-5 h-5 opacity-80"/>
  </div>

  <!-- Info -->
  <div class="flex flex-col flex-1 gap-0.5 min-w-0">
    <h3 class="font-bold text-site-text truncate">{{ group.name }}</h3>
    <p class="text-sm text-site-text-secondary truncate">{{ group.description }}</p>
    <span class="text-xs text-site-text-dim">{{ group.memberCount }} members</span>
  </div>

  <!-- Action -->
  @if (isCurrentGroup) {
    <button class="shrink-0 p-1.5 rounded-lg hover:bg-site-surface transition opacity-60 hover:opacity-100">
      <img src="assets/images/icons/navigation/settings.svg" class="w-4 h-4"/>
    </button>
  } @else {
    <button
      class="shrink-0 text-sm font-bold px-4 py-1.5 rounded-lg bg-site-accent text-site-text hover:brightness-110 transition"
    >
      Join
    </button>
  }

</div>
