<div class="flex flex-col items-center justify-center h-full w-full gap-8">
  <div class="bg-base-900 p-8 rounded-xl shadow w-120 border-base-800 border-2">

    <div class="flex flex-row justify-center mb-5">
      <div class="flex flex-col gap-4 items-center">
        <h1 class="text-5xl font-mono font-bold text-light text-glow-blue text-center">Login</h1>
        <p class="font-mono font-bold text-warning">{{ error }}</p>
      </div>
    </div>

    <form (ngSubmit)="login()" class="flex flex-col gap-3">
      <input
        [(ngModel)]="identifier"
        name="identifier"
        type="text"
        placeholder="Username or Email"
        autocomplete="username"
        class="w-full p-2 rounded text-light-300 bg-base-700 hover:bg-base-800 transition"
        id="identifier"
      />

      <input
        [(ngModel)]="password"
        name="password"
        type="password"
        placeholder="Password"
        autocomplete="current-password"
        class="w-full p-2 rounded text-light-300 bg-base-700 hover:bg-base-800 transition"
        id="password"
      />

      <button
        type="submit"
        class="w-full bg-base-600 text-glow-light-hover p-2 mt-3 rounded hover:bg-base-200 transition"
      >
        <p class="font-mono font-bold">Submit</p>
      </button>
    </form>
  </div>

  <div class="bg-base-900 p-8 rounded-xl shadow w-80 border-base-600 border-2 flex flex-col items-center justify-center gap-4">
    <p class="font-mono text-light">Don't have an account?</p>
    <button (click)="router.navigate(['/register'])" class="font-bold text-glow-blue-hover transition">Register Here</button>
  </div>
</div>
