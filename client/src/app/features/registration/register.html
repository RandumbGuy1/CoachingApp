<div class="flex flex-col items-center justify-center h-full w-full gap-8">
  <div class="bg-base-900 p-8 rounded-xl shadow w-150 border-light-300 border-1">

    <div class="flex flex-row justify-center mb-5">
      <div class="flex flex-col gap-4 items-center">
        <h1 class="text-5xl font-mono font-bold text-light text-glow-blue">Register</h1>
        <p class="font-mono font-bold text-warning">{{ error }}</p>
      </div>
    </div>

    <div class="flex flex-row justify-between">
      <div class="flex flex-col gap-3">
        <h1 class="text-2xl font-mono font-normal text-glow-light">Personal</h1>
        <input
              [(ngModel)]="request.firstName"
              type="name"
              placeholder="First Name"
              class="w-full p-2 rounded text-light-300 bg-base-700 hover:bg-base-800 transition"
              id="firstname"
            />

        <input
          [(ngModel)]="request.lastName"
          type="name"
          placeholder="Last Name"
          class="w-full p-2 rounded text-light-300 bg-base-700 hover:bg-base-800 transition"
          id="lastname"
        />

        <input
          [(ngModel)]="request.lastName"
          type="name"
          placeholder="Last Name"
          class="w-full p-2 rounded text-light-300 bg-base-700 hover:bg-base-800 transition"
          id="lastname"
        />

        <p-select 
          [(ngModel)]="request.gender" 
          [options]="genderOptions" 
          optionLabel="label" 
          placeholder="Select Gender"
        >
        </p-select>
        
        <p-select 
          [(ngModel)]="request.region" 
          [options]="regionOptions" 
          optionLabel="label" 
          placeholder="Select Region"          
        >
        </p-select>
      </div>
      <div class="flex flex-col gap-3">
        <h1 class="text-2xl font-mono font-normal text-glow-light">Account</h1>
        <input
          [(ngModel)]="request.username"
          type="name"
          placeholder="Username"
          class="w-full p-2 rounded text-light-300 bg-base-700 hover:bg-base-800 transition"
          id="username"
        />

        <input
          [(ngModel)]="request.email"
          type="email"
          placeholder="Email"
          class="w-full p-2 rounded text-light-300 bg-base-700 hover:bg-base-800 transition"
          id="email"
        />

        <input
          [(ngModel)]="request.password"
          type="password"
          placeholder="Password"
          class="w-full p-2 rounded text-light-300 bg-base-700 hover:bg-base-800 transition"
          id="password"
        />
      </div>
    </div>
    <button
      (click)="register()"
      class="w-full bg-base-600 text-glow-light-hover p-2 mt-6 rounded hover:bg-base-200 transition"
    >
      <p class="font-mono font-bold">Submit</p>
    </button>
  </div>

  <div class="bg-base-900 p-8 rounded-xl shadow w-80 border-light-300 border-1 flex flex-col items-center justify-center gap-4">
    <p class="font-mono text-light">Already have an account?</p>
    <button (click)="router.navigate(['/login'])" class="font-bold text-glow-blue-hover transition">Log in Here</button>
  </div>
</div>
