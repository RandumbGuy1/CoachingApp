<div class="noise-layer"></div>

<div class="blob" style="background: radial-gradient(circle, rgba(162, 198, 255, 0.12) 0%, transparent 65%); width: 700px; height: 700px; top: 50%; left: 50%; transform: translate(-50%, -50%);"></div>

<div class="relative max-w-5xl h-full mx-auto px-6 py-8 items-center justify-center flex flex-col gap-6">

  <h1 class="text-2xl font-bold text-site-text">Profile</h1>

  <div class="flex flex-col lg:flex-row gap-6 items-start">

    <!-- Profile card -->
    <div class="glass-card rounded-2xl p-7 flex flex-col gap-6 flex-1">

      <h2 class="text-xs font-bold text-site-accent uppercase tracking-widest">Personal Info</h2>

      <!-- Avatar + name -->
      <div class="flex items-start gap-5">
        <div class="relative shrink-0">
          <app-user-avatar
            [username]="userStore.getUser()?.username ?? ''"
            [avatarUrl]="previewUrl || profileRequest.avatarUrl"
            size="lg"
          />
          <label
            for="avatar"
            class="absolute -bottom-1 -right-1 w-7 h-7 rounded-full bg-site-accent flex items-center justify-center cursor-pointer hover:brightness-90 transition text-site-text text-base leading-none font-bold"
          >+</label>
          <input id="avatar" type="file" class="hidden" (change)="onFileSelected($event)" />
        </div>
        <div class="flex flex-col gap-2 flex-1">
          <input
            [(ngModel)]="profileRequest.firstName"
            name="firstName"
            type="text"
            placeholder="First Name"
            class="glass-input"
          />
          <input
            [(ngModel)]="profileRequest.lastName"
            name="lastName"
            type="text"
            placeholder="Last Name"
            class="glass-input"
          />
        </div>
      </div>

      <!-- Bio -->
      <div class="flex flex-col gap-1.5">
        <label class="text-xs text-site-text-secondary">Bio</label>
        <textarea
          [(ngModel)]="profileRequest.bio"
          name="bio"
          rows="4"
          placeholder="Tell us about yourself..."
          class="glass-input resize-none"
        ></textarea>
      </div>

      <!-- Selects -->
      <div class="grid grid-cols-1 sm:grid-cols-3 gap-3">
        <p-select
          class="w-full"
          [(ngModel)]="profileRequest.gender"
          name="gender"
          [options]="genderOptions"
          optionLabel="label"
          optionValue="value"
          placeholder="Gender"
        />
        <p-select
          class="w-full"
          [(ngModel)]="profileRequest.region"
          name="region"
          [options]="regionOptions"
          optionLabel="label"
          optionValue="value"
          placeholder="Region"
        />
        <p-select
          class="w-full"
          [(ngModel)]="profileRequest.theme"
          name="theme"
          [options]="themeOptions"
          optionLabel="label"
          optionValue="value"
          placeholder="Theme"
        />
      </div>

      <!-- Notifications -->
      <div class="flex items-center justify-between py-3 border-t border-site-border/50">
        <div class="flex flex-col gap-0.5">
          <span class="text-sm text-site-text">Email Notifications</span>
          <span class="text-xs text-site-text-dim">Receive updates and alerts by email</span>
        </div>
        <p-toggleswitch [(ngModel)]="profileRequest.receiveEmailNotifications" name="notifications" />
      </div>

      @if (error) {
        <p class="text-sm text-warning">{{ error }}</p>
      }

      <button
        (click)="saveProfile()"
        class="w-full bg-site-accent text-site-text font-bold py-2.5 rounded-lg hover:brightness-90 transition text-sm"
      >
        Save Profile
      </button>

    </div>

    <!-- Account card -->
    <div class="glass-card rounded-2xl p-7 flex flex-col gap-4 lg:w-80 w-full">

      <h2 class="text-xs font-bold text-site-accent uppercase tracking-widest">Account</h2>

      <input
        [(ngModel)]="userRequest.username"
        name="username"
        type="text"
        placeholder="Username"
        class="glass-input"
      />
      <p-select
        class="w-full"
        [(ngModel)]="userRequest.tier"
        name="tier"
        [options]="tierOptions"
        optionLabel="label"
        optionValue="value"
        placeholder="Tier"
      />

      @if (errorUser) {
        <p class="text-sm text-warning">{{ errorUser }}</p>
      }

      <button
        (click)="saveUser()"
        class="w-full bg-site-accent text-site-text font-bold py-2.5 rounded-lg hover:brightness-90 transition text-sm mt-auto"
      >
        Save Account
      </button>

    </div>

  </div>

</div>
