<div class="bg-base-900 rounded-xl border-base-800 border-2 p-6 flex flex-col gap-5">
  <h2 class="text-2xl font-mono font-bold text-light-300">Rank</h2>

  @if (!rankInfo) {
    <div class="flex items-center justify-center py-6">
      <p class="font-mono text-light-500">Loading...</p>
    </div>
  } @else {
    <div class="flex flex-col items-center gap-4">
      <!-- Badge -->
      <div
        class="w-24 h-24 rounded-full flex items-center justify-center"
        [style.background-color]="getBadgeBg()"
        [style.border]="getBadgeBorder()"
        [style.box-shadow]="getBadgeGlow()"
      >
        <span class="font-mono font-bold text-4xl" [style.color]="rankConfig.color">
          {{ rankConfig.initial }}
        </span>
      </div>

      <!-- Rank name -->
      <span
        class="text-2xl font-mono font-bold"
        [style.color]="rankConfig.color"
        [style.text-shadow]="'0 0 12px ' + rankConfig.color + 'cc'"
      >
        {{ rankConfig.label }}
      </span>

      <!-- ELO progress -->
      <div class="flex flex-col gap-1.5 w-full">
        <div class="flex justify-between w-full">
          <span class="font-mono text-xs text-light-500">{{ rankInfo.elo }} ELO</span>
          @if (rankConfig.maxElo) {
            <span class="font-mono text-xs text-light-600">{{ rankConfig.maxElo }}</span>
          } @else {
            <span class="font-mono text-xs text-light-600">MAX</span>
          }
        </div>
        <div class="w-full h-2 bg-base-700 rounded-full overflow-hidden">
          <div
            class="h-full rounded-full transition-all duration-500"
            [style.width.%]="getEloProgress()"
            [style.background-color]="rankConfig.color"
          ></div>
        </div>
      </div>

      <!-- Wilks score -->
      <div class="border-t border-base-700 w-full pt-3 flex justify-between">
        <span class="font-mono text-sm text-light-500">Wilks Score</span>
        <span class="font-mono font-bold text-light-300">{{ rankInfo.wilksScore }}</span>
      </div>
    </div>
  }
</div>
