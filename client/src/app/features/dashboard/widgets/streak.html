<div class="bg-base-900 rounded-xl border-base-800 border-2 p-6 flex flex-col gap-4">
  <h2 class="text-2xl font-mono font-bold text-light-300">Streak</h2>

  @if (!streak) {
    <div class="flex items-center justify-center py-6">
      <p class="font-mono text-light-500">Loading...</p>
    </div>
  } @else {
    <div class="flex flex-col gap-5">
      <div class="flex flex-col items-center gap-1 py-2">
        <span class="text-6xl font-mono font-bold text-warning">{{ streak.currentStreak }}</span>
        <span class="font-mono text-light-500 text-sm">day streak 🔥</span>
      </div>

      <div class="border-t border-base-700 pt-4 flex flex-col gap-3">
        <div class="flex justify-between">
          <span class="font-mono text-light-500 text-sm">Total Workouts</span>
          <span class="font-mono font-bold text-light-300">{{ streak.totalWorkouts }}</span>
        </div>
        <div class="flex justify-between">
          <span class="font-mono text-light-500 text-sm">Longest Streak</span>
          <span class="font-mono font-bold text-light-300">{{ streak.longestStreak }}</span>
        </div>
      </div>
    </div>
  }
</div>
