@if (auth.isLoggedIn()) {
  <p-select
    class="absolute top-5 right-10"
    [(ngModel)]="selectedMembership" 
    [options]="allMembershipOptions" 
    optionLabel="label"
    [placeholder]="!allMemberships ? 'No Memberships' : 'Select Membership'"
    [disabled]="!allMemberships"
  >
  </p-select>

  <p class="font-mono font-bold text-warning">{{ error }}</p>
}
