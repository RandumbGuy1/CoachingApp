services:
  db:
    image: mcr.microsoft.com/mssql/server:2025-latest
    container_name: coaching_app_server_container
    environment:
      - ACCEPT_EULA=Y
      # Local dev only. Not a real secret since the container only binds to localhost.
      # Prod uses its own credentials via docker-compose.override.yml
      - SA_PASSWORD=R85ae0a06!
    ports:
      - "1433:1433"
    volumes:
      - sql_data:/var/opt/mssql

volumes:
  sql_data: