<div class="flex p-5 gap-5 items-center h-40 rounded-md bg-base-light">
  <div
    class="flex items-center justify-center rounded-md h-30 w-30"
    [style.background-color]="group.color"
  >
    <img src="assets/images/nav-icons/groups.svg" class="p-5"/>
  </div>

  <div class="flex flex-col">
    <h1 class="text-3xl font-bold">{{ group.name }}</h1>
    <p class="text-lg">{{ group.description }}</p>
  </div>

  <div class="flex flex-col h-full justify-start items-start">
    @if (isCurrentGroup) {
      <button
        class="relative hover:scale-110 transition"
      >
        <img src="assets/images/nav-icons/settings.svg" class="w-[25px] h-[25px]">
      </button>
    } @else {
      <button
        class="bg-brand bg-base-light border-glow-blue border-2 text-white p-2 rounded hover:opacity-60 transition w-20"
      >
        <p class="font-mono font-bold">Join</p>
      </button>
    }
  </div>
</div>
