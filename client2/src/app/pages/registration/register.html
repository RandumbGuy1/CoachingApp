<div class="flex flex-col items-center justify-center h-full w-full gap-8">
  <div class="bg-base-light p-8 rounded-xl shadow w-80">
    <h1 class="text-5xl font-mono font-bold mb-4 text-light">Register</h1>

    <p class="font-mono font-bold text-warning mb-3">{{ error }}</p>

    <input
      [(ngModel)]="username"
      type="name"
      placeholder="Username"
      class="w-full p-2 border-light border-2 rounded mb-3 text-light"
    />

    <input
      [(ngModel)]="email"
      type="email"
      placeholder="Email"
      class="w-full p-2 border-light border-2 rounded mb-3 text-light"
    />

    <input
      [(ngModel)]="password"
      type="password"
      placeholder="Password"
      class="w-full p-2 border-light border-2 rounded mb-4 text-light"
    />

    <div class="flex flex-row mb-3 gap-5">
      <p class="font-mono font-bold">Coach</p>
      <p-toggleswitch [(ngModel)]="checked"/>
    </div>

    <button
      (click)="register()"
      class="w-full bg-brand bg-base text-white p-2 rounded hover:opacity-60 transition"
    >
      <p class="font-mono font-bold">Submit</p>
    </button>
  </div>

  <div class="bg-base-light p-8 rounded-xl shadow w-80">
    <p class="font-mono text-light ">
      Already have an account? <br>
      <button (click)="router.navigate(['/login'])" class="text-brand text-glow-blue font-bold hover:underline cursor-pointer">Log in Here</button>
    </p>
  </div>
</div>
